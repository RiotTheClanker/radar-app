name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    name: rust engine (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/radar_core
      - name: cargo test
        working-directory: rust/radar_core
        run: cargo test --release
      - name: cargo clippy
        working-directory: rust/radar_core
        run: cargo clippy --release -- -D warnings
        continue-on-error: true

  linux:
    name: linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev fakeroot
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: package
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in [0-9]*) ;; *) V="0.1.0~dev+${GITHUB_SHA::7}" ;; esac
          ./packaging/build-deb.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: radar-app-linux-deb
          path: dist/*.deb

  windows:
    name: windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: build installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if (-not $v -or $v -notmatch '^\d') { $v = "0.1.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging\windows-installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: radar-app-windows-setup
          path: dist/*.exe

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'
      - run: flutter pub get
        working-directory: app
      - name: build apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: flutter build apk --release --split-per-abi
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: radar-app-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  release:
    name: attach builds to the release
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: list what we got
        run: find artifacts -type f -printf '%p  %s bytes\n'
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
